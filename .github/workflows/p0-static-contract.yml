name: Pi host integration + package contract

on:
  push:
    paths:
      - "package.json"
      - "extensions/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/p0-static-contract.yml"
  pull_request:
    paths:
      - "package.json"
      - "extensions/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/p0-static-contract.yml"

jobs:
  manifest-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Test core and Pi package manifest
        run: npm test
      - name: Check npm pack asset list
        run: npm pack --dry-run --json --ignore-scripts > /tmp/pi-memory-pack.json
      - name: Assert Pi TypeScript entrypoint is in npm artifact
        run: |
          node -e 'const fs=require("fs"); const a=JSON.parse(fs.readFileSync("/tmp/pi-memory-pack.json","utf8")); if(!a[0].files.some(f=>f.path==="extensions/pi-memory.ts")) process.exit(1)'

  pi-rpc-local:
    runs-on: ubuntu-latest
    needs: manifest-and-pack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: npm install -g @earendil-works/pi-coding-agent@1.5.2
      - name: Test actual Pi Extension registration through RPC
        run: node tests/pi-rpc-install-smoke.mjs
      - name: Test real Pi manual index + cross-session recall via RPC
        run: node tests/pi-rpc-recall-smoke.mjs
      - name: Verify untrusted Pi project cannot access local memory
        run: node tests/pi-rpc-untrusted-smoke.mjs
      - name: Differential-test projection vs installed Pi SDK
        run: node tests/pi-projection-diff.mjs
      - name: Verify L4 before_agent_start against real Pi SDK (no model API)
        run: node tests/pi-l4-sdk-hook-smoke.mjs

  pi-rpc-git-install:
    runs-on: ubuntu-latest
    needs: manifest-and-pack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: npm install -g @earendil-works/pi-coding-agent@1.5.2
      - name: Install pi-memory as a pinned Pi Git package
        run: |
          export PI_CODING_AGENT_DIR="$(mktemp -d)"
          echo "PI_CODING_AGENT_DIR=$PI_CODING_AGENT_DIR" >> "$GITHUB_ENV"
          pi install "git:github.com/1998x-stack/pi-memory@${GITHUB_SHA}"
          pi list
      - name: Test extension from installed Git package through Pi RPC
        run: node tests/pi-rpc-install-smoke.mjs --installed
      - name: Verify --no-extensions disables package registration
        run: node tests/pi-rpc-install-smoke.mjs --installed --disabled
      - name: Verify pinned Git update/removal preserves memory data outside checkout
        run: |
          SOURCE="git:github.com/1998x-stack/pi-memory@${GITHUB_SHA}"
          mkdir -p "$PI_CODING_AGENT_DIR/memory"
          echo "user-persistent-memory-test" > "$PI_CODING_AGENT_DIR/memory/uninstall-sentinel.txt"
          pi update --extensions
          test "$(cat "$PI_CODING_AGENT_DIR/memory/uninstall-sentinel.txt")" = "user-persistent-memory-test"
          pi remove "$SOURCE"
          test "$(cat "$PI_CODING_AGENT_DIR/memory/uninstall-sentinel.txt")" = "user-persistent-memory-test"

